name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

      # The build above is the test suite: every module under `PalamedesTest/Corpus/` synthesizes a
      # generator at elaboration time, so a search regression fails it. Some synthesis defects
      # surface only as warnings, which `lake build` exits 0 on; see CLAUDE.md's "Warnings hide real
      # failures" for which ones and why the rebuild below is what catches them.
      - name: Rebuild project modules, failing on warnings
        run: |
          lake clean palamedes
          lake build --wfail

      # `PalamedesExperiments` is excluded from the default build, so nothing else notices when a
      # spike stops elaborating against the current library. Reported, not enforced.
      - name: Build the experiment spikes
        continue-on-error: true
        run: lake build PalamedesExperiments
