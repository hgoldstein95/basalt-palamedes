name = "palamedes"
version = "0.1.0"
defaultTargets = ["Palamedes", "PalamedesExamples", "PalamedesTest"]

# The library: the `generator_search` tactic, synthesis rules, supported datatypes, and sampler.
# `Palamedes.*` globs every library module so a plain `lake build` compiles all of them, not just
# the import closure of the `Palamedes` root.
[[lean_lib]]
name = "Palamedes"
globs = ["Palamedes", "Palamedes.+"]

# Teaching material: no assertions, nothing here guards anything.
[[lean_lib]]
name = "PalamedesExamples"
globs = ["PalamedesExamples.+"]

# The tests. `PalamedesTest.Corpus.+` is the synthesis corpus: every module synthesizes a generator
# at elaboration time and fails to compile if synthesis fails. The files above it guard one library
# module each — `PalamedesTest.Extract` guards against silent extraction residue, and so on. Built
# by `lake build` (it is a default target), which is what CI runs.
[[lean_lib]]
name = "PalamedesTest"
globs = ["PalamedesTest.+"]

# Exploratory spikes — design questions being answered in code, not examples pending synthesis.
# Excluded from the default build (and so from CI); build on demand with
# `lake build PalamedesExperiments`.
[[lean_lib]]
name = "PalamedesExperiments"
globs = ["PalamedesExperiments.+"]

[[require]]
name = "basalt"
git = "https://github.com/hgoldstein95/basalt"
rev = "main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0-rc1"

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "v4.33.0-rc1"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "v4.33.0-rc1"
